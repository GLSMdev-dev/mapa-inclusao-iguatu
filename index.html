<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa da Inclusão - Iguatu/CE</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css?v=20260703" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-container">
        <a href="index.html" class="nav-brand">
          <div class="brand-mark">
            <img src="assets/logo.jpeg" alt="PertenSer" onerror="this.style.display='none'" />
          </div>
          <div class="brand-text">
            <span class="brand-name">Perten<span>Ser</span></span>
            <small class="brand-sub">Vozes, Identidades e Futuros</small>
          </div>
        </a>
        <button class="nav-toggle" id="navToggle">
          <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-menu" id="navMenu">
          <li>
            <a href="index.html" class="active"><i class="fas fa-map"></i> Mapa</a>
          </li>
          <li>
            <button type="button" class="nav-link-btn" id="openRegisterModal">
              <i class="fas fa-plus-circle"></i> Cadastrar
            </button>
          </li>
          <li>
            <a href="configuracao.html"><i class="fas fa-cog"></i> Configurações</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- BANNER -->
    <div class="banner-container">
      <img src="assets/banner.png" alt="Banner Projeto PertenSer" />
    </div>

    <!-- Container Principal -->
    <div class="main-container">
      
      <!-- ZONA DE HOVER INVISÍVEL (Garante a ativação por mouse) -->
      <div class="sidebar-hover-zone"></div>

      <!-- BOTÃO TRIGGER DA SIDEBAR (Seta) -->
      <button id="sidebar-trigger" aria-label="Abrir menu lateral">
        <i class="fas fa-chevron-right"></i>
      </button>

      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="filters-container">
          <div class="sidebar-actions">
            <button type="button" class="btn btn-primary" id="pickLocationHint">
              <i class="fas fa-map-marker-alt"></i> Marcar nova ação
            </button>
            <button type="button" class="btn btn-secondary hidden" id="cancelAddMode">
              <i class="fas fa-times"></i> Cancelar
            </button>
          </div>
          <h3><i class="fas fa-filter"></i> Filtros</h3>

          <!-- Busca -->
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar localização..." />
            <button id="searchBtn"><i class="fas fa-search"></i></button>
          </div>

          <!-- Filtro por Categoria -->
          <div class="filter-group">
            <label><i class="fas fa-tags"></i> Categoria</label>
            <select id="categoryFilter">
              <option value="all">Todas as categorias</option>
            </select>
          </div>

          <!-- ESTATÍSTICAS EM DROPDOWN -->
          <div class="stats-container" id="statsContainer">
            <button class="stats-header" id="statsToggle" aria-expanded="false">
              <span><i class="fas fa-chart-bar"></i> Estatísticas</span>
              <i class="fas fa-chevron-down"></i>
            </button>
            <div class="stats-content" id="statsContentWrapper">
               <div id="statsContent">
                  <!-- Gerado Dinamicamente -->
               </div>
            </div>
          </div>

          <!-- Lista de Localizações (Vertical) -->
          <div class="locations-list" id="locationsList">
            <div class="list-header">
              <h3><i class="fas fa-list"></i> Localizações</h3>
              <span id="listCount">0 encontrados</span>
            </div>
            <div id="locationsContainer" class="locations-grid">
              <!-- Cards gerados dinamicamente -->
            </div>
          </div>
        </div>
      </aside>

      <!-- Conteúdo Principal (Apenas o Mapa) -->
      <main class="content">
        <div id="map" class="map-container"></div>
      </main>
    </div>

    <!-- MODAIS -->
    <div class="modal-backdrop" id="registerModal">
      <div class="modal-card">
        <div class="modal-header">
          <h3><i class="fas fa-plus-circle"></i> Nova ação inclusiva</h3>
          <button type="button" class="modal-close" id="closeRegisterModal"><i class="fas fa-times"></i></button>
        </div>
        <form id="locationFormModal" class="modal-form">
          <div class="form-grid">
            <div class="form-group">
              <label for="actionName">Nome da ação <span class="required">*</span></label>
              <input id="actionName" name="actionName" required />
            </div>
            <div class="form-group">
              <label for="actionCategory">Tipo de serviço <span class="required">*</span></label>
              <select id="actionCategory" name="actionCategory" required></select>
            </div>
          </div>
          <div class="form-group">
            <label for="actionDescription">Descrição</label>
            <textarea id="actionDescription" name="actionDescription" rows="3"></textarea>
          </div>
         <div class="form-grid">
            <div class="form-group">
                <label for="publicTarget">Público-alvo</label>
                <input id="publicTarget" name="publicTarget" />
            </div>
            <div class="form-group">
                <label for="professionals">Profissionais</label>
                <input id="professionals" name="professionals" />
            </div>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label for="contactEmail">Email</label>
                <input id="contactEmail" name="contactEmail" type="email" placeholder="contato@exemplo.com" />
            </div>
            <div class="form-group">
                <label for="contactPhone">Telefone</label>
                <input id="contactPhone" name="contactPhone" type="tel" placeholder="(88) 99999-9999" />
            </div>
        </div>
        <div class="form-group">
            <label for="responsible">Responsável</label>
            <input id="responsible" name="responsible" placeholder="Nome da pessoa responsável" />
        </div>
          <div class="form-grid">
            <div class="form-group">
              <label for="address">Endereço</label>
              <input id="address" name="address" />
            </div>
            <div class="form-group">
              <label for="pinColor">Cor do pin</label>
              <div class="color-picker">
                <input id="pinColor" name="pinColor" type="hidden" value="#e74c3c" />
                <button type="button" class="color-swatch active" data-color="#e74c3c" style="background:#e74c3c"></button>
                <button type="button" class="color-swatch" data-color="#3498db" style="background:#3498db"></button>
                <button type="button" class="color-swatch" data-color="#2ecc71" style="background:#2ecc71"></button>
                <button type="button" class="color-swatch" data-color="#9b59b6" style="background:#9b59b6"></button>
                <button type="button" class="color-swatch" data-color="#f39c12" style="background:#f39c12"></button>
                <button type="button" class="color-swatch" data-color="#16a085" style="background:#16a085"></button>
              </div>
            </div>
          </div>
          <div class="form-group">
            <input id="latitude" name="latitude" type="hidden" />
            <input id="longitude" name="longitude" type="hidden" />
          </div>
          <div class="form-group">
            <label>Fotos da ação</label>
            <div class="drop-zone" id="dropZoneModal">
              <i class="fas fa-cloud-upload-alt"></i>
              <p>Arraste imagens aqui ou clique para selecionar</p>
              <input id="photoInput" type="file" accept="image/*" multiple />
            </div>
            <div id="imagePreviewModal" class="image-preview"></div>
          </div>
          <div class="form-actions modal-actions">
            <button type="button" class="btn btn-secondary" id="cancelRegisterModal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="submitActionBtn">
              <i class="fas fa-save"></i> Salvar ação
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-backdrop" id="detailsModal">
      <div class="modal-card details-modal-card">
        <div class="modal-header">
          <h3 id="detailsModalTitle">Detalhes da ação</h3>
          <button type="button" class="modal-close" id="closeDetailsModal"><i class="fas fa-times"></i></button>
        </div>
        <div id="detailsModalContent" class="details-modal-content"></div>
        <div id="detailsModalImages" class="details-modal-images"></div>
      </div>
    </div>

    <!-- RODAPÉ -->
    <footer class="site-footer">
        <div class="footer-img-container">
            <img src="assets/rodape.png" alt="Rodapé com informações do projeto" />
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <script src="js/config.js?v=20260703"></script>
    <script src="js/logger.js?v=20260703"></script>
    <script src="js/utils.js?v=20260703"></script>
    <script src="js/api.js?v=20260703"></script>
    <script src="js/mapa.js?v=20260703"></script>
    <script src="js/app.js?v=20260703"></script>
  </body>
</html>
